[project]
name = "buyer-audit-api"
version = "0.1.0"
description = "Reusable buyer audit foundation for the PBL agent payment project"
requires-python = ">=3.12,<3.13"
dependencies = [
  "abnf==2.2.0",
  "cryptography>=44,<47",
  "eth-account>=0.13.7,<0.14",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "pymongo>=4.13,<5",
  "rfc8785>=0.1.4,<1",
  "siwe==4.4.0",
  "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.8,<1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buyer_audit_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "mongo: requires a real local MongoDB"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["buyer_audit_api"]
mypy_path = "src"
